<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGT-PRO</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

#map {
    height: 100vh;
}

.status-box {
    position: fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#6366f1;
    color:white;
    padding:10px 20px;
    border-radius:20px;
    font-size:14px;
}
</style>
</head>
<body>

<div id="map"></div>
<div class="status-box" id="status">Memulai sistem...</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-messaging-compat.js"></script>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ================================
// 🔥 FIREBASE CONFIG
// ================================
const firebaseConfig = {
    apiKey: "AIzaSyCahZIFKFXMCokFNxCpFokNSVtKzN4llus",
    authDomain: "cedar-setup-425414-d7.firebaseapp.com",
    databaseURL: "https://cedar-setup-425414-d7-default-rtdb.firebaseio.com",
    projectId: "cedar-setup-425414-d7",
    storageBucket: "cedar-setup-425414-d7.appspot.com",
    messagingSenderId: "723545991983",
    appId: "1:723545991983:web:379548d2b425a502a60fda"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();
const messaging = firebase.messaging();

// ================================
// 🗺 MAP INIT
// ================================
const map = L.map('map').setView([-8.65,115.216], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap'
}).addTo(map);

let myMarker;
let anggotaMarkers = {};

// ================================
// 📍 REALTIME LOCATION TRACKING
// ================================
function startTracking() {

    if (!navigator.geolocation) {
        alert("Geolocation tidak didukung");
        return;
    }

    document.getElementById("status").innerText = "Tracking aktif...";

    navigator.geolocation.watchPosition(position => {

        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        const userId = "driver_" + Math.floor(Math.random()*9999);

        database.ref("drivers/" + userId).set({
            lat: lat,
            lng: lng,
            timestamp: Date.now()
        });

        if (!myMarker) {
            myMarker = L.marker([lat,lng]).addTo(map)
                .bindPopup("Saya");
        } else {
            myMarker.setLatLng([lat,lng]);
        }

    }, error => {
        console.error(error);
        alert("Izin lokasi ditolak!");
    },{
        enableHighAccuracy:true,
        maximumAge:0,
        timeout:5000
    });
}

// ================================
// 🟢 TAMPILKAN SEMUA ANGGOTA
// ================================
database.ref("drivers").on("value", snapshot => {

    const data = snapshot.val();
    if (!data) return;

    for (let id in data) {

        const driver = data[id];

        if (!anggotaMarkers[id]) {
            anggotaMarkers[id] = L.marker([driver.lat, driver.lng])
                .addTo(map)
                .bindPopup("Anggota: " + id);
        } else {
            anggotaMarkers[id].setLatLng([driver.lat, driver.lng]);
        }
    }
});

// ================================
// 🔔 PUSH NOTIFICATION
// ================================
async function initNotification() {

    const permission = await Notification.requestPermission();

    if (permission === "granted") {

        const token = await messaging.getToken({
            vapidKey: "BEluGantiDenganVapidKeyKamu"
        });

        console.log("FCM Token:", token);

        database.ref("fcmTokens").push(token);

    } else {
        console.log("Notifikasi ditolak");
    }
}

// ================================
// 📱 SERVICE WORKER
// ================================
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('firebase-messaging-sw.js')
        .then(() => console.log("SW registered"));
}

// ================================
// 🚀 START SYSTEM
// ================================
startTracking();
initNotification();

</script>

</body>
</html>
