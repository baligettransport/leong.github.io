<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orderan Masuk - BGT-PRO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb; --primary-light: #3b82f6; --accent: #0ea5e9;
            --success: #10b981; --danger: #ef4444; --bg-main: #f0f9ff;
            --bg-card: #ffffff; --text-dark: #0f172a; --text-gray: #64748b;
            --border-light: #e2e8f0; --gradient-primary: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            --shadow-soft: 0 4px 20px rgba(37, 99, 235, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow-x: hidden; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-main); color: var(--text-dark); min-height: 100dvh; }

        .app-container { width: 100%; min-height: 100dvh; padding-bottom: 20px; }

        /* Loading Screen */
        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--gradient-primary);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
        }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3); border-top-color: white;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        .loading-text { color: white; font-size: 1rem; margin-top: 16px; font-weight: 500; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }

        /* Header */
        .header { 
            position: sticky; top: 0; z-index: 100; 
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); 
            padding: 12px 16px; border-bottom: 1px solid var(--border-light); 
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .back-btn { 
            width: 38px; height: 38px; background: var(--bg-main); 
            border: none; border-radius: 10px; color: var(--primary); font-size: 1rem; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
        }
        .back-btn:active { background: #e0f2fe; transform: scale(0.95); }

        /* Filter Tabs */
        .filter-tabs { display: flex; gap: 6px; padding: 8px 16px 12px; overflow-x: auto; margin-top: 4px; }
        .filter-tab { 
            padding: 8px 16px; background: var(--bg-card); 
            border: 1px solid var(--border-light); border-radius: 9999px; 
            font-size: 0.8rem; font-weight: 500; color: var(--text-gray); 
            cursor: pointer; white-space: nowrap; transition: all 0.3s; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); position: relative;
        }
        .filter-tab.active { 
            background: var(--gradient-primary); border-color: transparent; 
            color: white; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); 
        }
        .tab-badge {
            position: absolute; top: -5px; right: -5px;
            min-width: 18px; height: 18px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border-radius: 50%; font-size: 0.6rem; font-weight: 700; color: white;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 1px 4px rgba(239, 68, 68, 0.3); z-index: 10;
        }
        .tab-badge.hidden { display: none; }

        /* Order List */
        .order-list { padding: 0 16px; }
        .order-card { 
            background: var(--bg-card); border-radius: 12px; 
            margin-bottom: 10px; overflow: hidden; 
            border: 1px solid var(--border-light); 
            box-shadow: var(--shadow-soft); transition: transform 0.2s;
        }
        .order-card:active { transform: scale(0.99); }
        
        .order-content { padding: 12px; }
        
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .order-id { font-size: 0.75rem; color: var(--primary); font-weight: 600; }
        .order-badge { padding: 3px 8px; border-radius: 9999px; font-size: 0.65rem; font-weight: 600; }
        .order-badge.new { background: rgba(245, 158, 11, 0.1); color: #d97706; }
        .order-badge.progress { background: rgba(37, 99, 235, 0.1); color: var(--primary); }
        .order-badge.done { background: rgba(16, 185, 129, 0.1); color: var(--success); }

        /* Split Info Layout */
        .split-info { display: flex; gap: 10px; margin-bottom: 8px; }
        
        .info-box {
            flex: 1; border-radius: 10px; padding: 10px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .info-box.customer {
            background: rgba(37, 99, 235, 0.05);
            border: 1px solid rgba(37, 99, 235, 0.15);
        }
        .info-box.driver {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.15);
        }
        
        .info-title {
            font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            padding-bottom: 4px; border-bottom: 1px dashed rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 6px;
        }
        .info-box.customer .info-title { color: var(--primary); }
        .info-box.driver .info-title { color: #15803d; }
        
        /* Row Styling */
        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }
        .info-row i {
            width: 16px;
            text-align: center;
            font-size: 0.75rem;
        }
        .info-box.customer .info-row i { color: var(--primary); }
        .info-box.driver .info-row i { color: #15803d; }
        
        .info-val {
            font-weight: 500;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .info-val.link { color: var(--primary); text-decoration: none; font-weight: 600; }
        
        /* Plate Style */
        .plate-tag {
            background: #1e293b;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid #0f172a;
        }

        /* Customer Info Single */
        .customer-info-single {
            background: rgba(37, 99, 235, 0.05);
            border: 1px solid rgba(37, 99, 235, 0.15); border-radius: 10px;
            padding: 10px; margin-bottom: 8px;
        }
        .customer-header {
            font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--primary); margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
            padding-bottom: 4px; border-bottom: 1px dashed rgba(0,0,0,0.1);
        }
        .customer-rows { display: flex; flex-direction: column; gap: 6px; }

        /* Keterangan, Deskripsi, Koper */
        .ket-box { border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
        .ket-label { font-size: 0.6rem; font-weight: 600; text-transform: uppercase; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
        .ket-text { font-size: 0.75rem; color: var(--text-dark); line-height: 1.3; }
        
        .keterangan-box { background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); }
        .keterangan-label { color: #dc2626; }
        
        .deskripsi-box { background: rgba(37, 99, 235, 0.05); border: 1px solid rgba(37, 99, 235, 0.2); }
        .deskripsi-label { color: var(--primary); }
        
        .koper-box { background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.3); }
        .koper-label { color: #d97706; }

        /* Image */
        .order-image, .photo-preview { 
            width: 100%; height: 100px; object-fit: cover; border-radius: 8px; 
            margin-bottom: 8px; display: block; cursor: pointer;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        }
        .photo-preview { height: 120px; border: 2px solid var(--success); }

        /* Route Visual */
        .route-wrapper { margin-bottom: 10px; position: relative; padding-left: 18px; }
        .route-line { position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--border-light); border-radius: 2px; }
        .route-dot { position: absolute; left: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg-card); z-index: 1; box-shadow: 0 0 0 1px rgba(0,0,0,0.1); }
        .route-dot.start { top: 0; background: var(--success); }
        .route-dot.end { bottom: 0; background: var(--danger); }
        
        .route-point { margin-bottom: 14px; position: relative; }
        .route-point:last-child { margin-bottom: 0; }
        .route-label { font-size: 0.6rem; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1px; font-weight: 600; }
        .route-address {
            font-size: 0.8rem; font-weight: 500; line-height: 1.3; color: var(--text-dark);
            cursor: pointer; display: flex; align-items: flex-start; gap: 6px; transition: color 0.2s;
        }
        .route-address:hover { color: var(--primary); }
        .route-address i { color: var(--primary); font-size: 0.7rem; margin-top: 2px; flex-shrink: 0; }
        .route-address.disabled { cursor: default; pointer-events: none; opacity: 0.8; }

        .order-info { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--bg-main); padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; 
        }
        .order-price { font-size: 0.95rem; font-weight: 700; color: var(--primary); }
        .order-distance { font-size: 0.7rem; color: var(--text-gray); display: flex; align-items: center; gap: 3px; }

        .order-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-light); padding-top: 10px; margin-top: 5px; }
        
        .order-datetime { display: flex; align-items: center; gap: 10px; }
        .datetime-date { font-size: 0.7rem; font-weight: 500; color: var(--text-dark); display: flex; align-items: center; gap: 4px; }
        .datetime-date i { color: var(--text-gray); font-size: 0.65rem; }
        .datetime-time { font-size: 0.7rem; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 4px; }
        
        .action-buttons { display: flex; gap: 8px; }
        .action-btn { 
            padding: 6px 14px; border: none; border-radius: 6px; 
            color: white; font-size: 0.7rem; font-weight: 600; cursor: pointer; 
            transition: transform 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .action-btn:active { transform: scale(0.95); }
        .action-btn.take { background: var(--primary); }
        .action-btn.finish { background: linear-gradient(135deg, #10b981 0%, #34d399 100%); }
        .action-btn.cancel-btn { background: linear-gradient(135deg, #ef4444 0%, #f87171 100%); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-gray); background: var(--bg-card); border-radius: 16px; margin: 0 16px; border: 1px dashed var(--border-light); }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: #cbd5e1; }

        /* Image Modal */
        .image-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000;
            align-items: center; justify-content: center; flex-direction: column;
        }
        .image-modal.active { display: flex; }
        .image-modal img { max-width: 95%; max-height: 90%; border-radius: 10px; -webkit-touch-callout: none; user-select: none; pointer-events: none; }
        .close-modal-btn { position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem; cursor: pointer; z-index: 2001; }

        /* Camera Modal */
        .camera-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .camera-modal.active { display: flex; }
        .camera-container { width: 100%; max-width: 400px; position: relative; }
        .camera-video { width: 100%; border-radius: 12px; transform: scaleX(-1); }
        .camera-canvas { display: none; }
        .camera-controls { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .camera-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transition: transform 0.2s;
        }
        .camera-btn:active { transform: scale(0.9); }
        .camera-btn.capture { background: white; color: #000; }
        .camera-btn.cancel { background: #ef4444; color: white; }
        .camera-btn.confirm { background: #10b981; color: white; }
        .camera-preview-img { width: 100%; max-width: 400px; border-radius: 12px; display: none; }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Memuat data...</div>
    </div>

    <div class="app-container" id="mainApp" style="display: none;">
        <header class="header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='branda.html'"><i class="fas fa-arrow-left"></i></button>
                <div class="header-title">Orderan Masuk</div>
            </div>
        </header>

        <div class="filter-tabs">
            <div class="filter-tab active" onclick="filterOrders('all')">Semua</div>
            <div class="filter-tab" onclick="filterOrders('order')">Orderan <span class="tab-badge hidden" id="orderTabBadge">0</span></div>
            <div class="filter-tab" onclick="filterOrders('berjalan')">Berjalan</div>
            <div class="filter-tab" onclick="filterOrders('selesai')">Selesai</div>
        </div>

        <div class="order-list" id="orderList">
            <div class="empty-state"><i class="fas fa-box-open"></i><p>Tidak ada orderan</p></div>
        </div>
    </div>

    <!-- Image View Modal -->
    <div class="image-modal" id="imageModal" onclick="closeImageModal()">
        <i class="fas fa-times close-modal-btn"></i>
        <img id="modalImageSrc" src="" alt="Preview">
    </div>

    <!-- Camera Modal -->
    <div class="camera-modal" id="cameraModal">
        <div class="camera-instruction"><i class="fas fa-camera"></i> Foto Selfie dengan Tamu</div>
        <div class="camera-container">
            <video class="camera-video" id="cameraVideo" autoplay playsinline></video>
            <canvas class="camera-canvas" id="cameraCanvas"></canvas>
            <img class="camera-preview-img" id="cameraPreviewImg">
        </div>
        <div class="camera-controls">
            <button class="camera-btn cancel" onclick="closeCamera()"><i class="fas fa-times"></i></button>
            <button class="camera-btn capture" id="captureBtn" onclick="capturePhoto()"><i class="fas fa-camera"></i></button>
            <button class="camera-btn confirm" id="confirmBtn" onclick="confirmPhoto()" style="display:none;"><i class="fas fa-check"></i></button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCahZIFKFXMCokFNxCpFokNSVtKzN4llus",
            authDomain: "cedar-setup-425414-d7.firebaseapp.com",
            databaseURL: "https://cedar-setup-425414-d7-default-rtdb.firebaseio.com",
            projectId: "cedar-setup-425414-d7",
            storageBucket: "cedar-setup-425414-d7.firebasestorage.app",
            messagingSenderId: "723545991983",
            appId: "1:723545991983:web:379548d2b425a502a60fda"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const firestore = firebase.firestore();
        
        let currentUserId = null;
        let currentUserData = null;
        let orderData = [];
        let currentFilter = 'all';
        let cameraStream = null;
        let capturedPhotoBlob = null;
        let currentFinishingOrderId = null;

        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e => console.error(e));

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUserId = user.uid;
                try {
                    const userDoc = await firestore.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        currentUserData = userDoc.data();
                        localStorage.setItem('userData', JSON.stringify(currentUserData));
                        console.log("✅ Profil Driver Dimuat:", currentUserData);
                    }
                } catch (err) {
                    console.error("Error ambil profil:", err);
                    const localUserData = localStorage.getItem('userData');
                    if (localUserData) currentUserData = JSON.parse(localUserData);
                }
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('mainApp').style.display = 'block';
            } else {
                window.location.href = 'index.html';
            }
        });

        // Utils
        function playNotificationSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                [880, 1100].forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain); gain.connect(audioContext.destination);
                        osc.frequency.value = freq; osc.type = 'sine';
                        gain.gain.setValueAtTime(0.5, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                        osc.start(); osc.stop(audioContext.currentTime + 0.15);
                    }, i * 200);
                });
            } catch (e) {}
        }
        function speakNewJob() { playNotificationSound(); if ('speechSynthesis' in window) setTimeout(() => { const u = new SpeechSynthesisUtterance('Ada job baru'); u.lang = 'id-ID'; window.speechSynthesis.speak(u); }, 500); }

        function filterOrders(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderOrders();
        }

        function isMyOrder(order) {
            const myId = currentUserId || '';
            const myName = (currentUserData && currentUserData.nama) ? currentUserData.nama : '';
            return (order.driverId && order.driverId === myId) || (order.driverName && myName && order.driverName === myName);
        }

        function openImageModal(src) { document.getElementById('modalImageSrc').src = src; document.getElementById('imageModal').classList.add('active'); }
        function closeImageModal() { document.getElementById('imageModal').classList.remove('active'); }
        document.addEventListener('contextmenu', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });

        function renderOrders() {
            const list = document.getElementById('orderList');
            let filtered = orderData;
            
            if (currentFilter === 'order') filtered = orderData.filter(o => o.status === 'order');
            else if (currentFilter === 'berjalan') filtered = orderData.filter(o => o.status === 'berjalan' && isMyOrder(o));
            else if (currentFilter === 'selesai') filtered = orderData.filter(o => o.status === 'selesai' && isMyOrder(o));

            if (filtered.length === 0) {
                let msg = 'Tidak ada data';
                if (currentFilter === 'berjalan') msg = 'Tidak ada order yang berjalan';
                else if (currentFilter === 'selesai') msg = 'Belum ada riwayat selesai';
                else if (currentFilter === 'order') msg = 'Tidak ada order baru';
                list.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>${msg}</p></div>`;
                return;
            }

            list.innerHTML = filtered.map(o => {
                // State Logic
                let badgeClass = 'new', badgeText = 'ORDER', btnHtml = '', isDisabled = false;
                let showDriver = false;

                if (currentFilter === 'all') {
                    if (o.status === 'order') { badgeClass = 'new'; badgeText = 'ORDER BARU'; }
                    else if (o.status === 'berjalan') { badgeClass = 'progress'; badgeText = 'BERJALAN'; }
                    else if (o.status === 'selesai') { badgeClass = 'done'; badgeText = 'SELESAI'; }
                    isDisabled = true; btnHtml = ''; 
                    if (o.driverName || o.driverPlate) showDriver = true;
                }
                else if (currentFilter === 'order') {
                    badgeClass = 'new'; badgeText = 'TERSEDIA';
                    btnHtml = `<button class="action-btn take" onclick="takeOrder(event, '${o.id}')"><i class="fas fa-hand-holding-heart"></i> Ambil</button>`;
                    showDriver = false;
                }
                else if (currentFilter === 'berjalan') {
                    badgeClass = 'progress'; badgeText = 'BERJALAN';
                    isDisabled = false; showDriver = true;
                    btnHtml = `
                        <div class="action-buttons">
                            <button class="action-btn cancel-btn" onclick="cancelOrder(event, '${o.id}')"><i class="fas fa-times"></i> Batal</button>
                            <button class="action-btn finish" onclick="openCameraForFinish(event, '${o.id}')"><i class="fas fa-camera"></i> Selesai</button>
                        </div>`;
                }
                else if (currentFilter === 'selesai') {
                    badgeClass = 'done'; badgeText = 'SELESAI';
                    isDisabled = true; showDriver = true; btnHtml = '';
                }

                // Image
                let imgHtml = '';
                if (o.finishPhoto) imgHtml = `<img src="${o.finishPhoto}" class="photo-preview" onclick="openImageModal(this.src)">`;
                else if (o.imageUrl) imgHtml = `<img src="${o.imageUrl}" class="order-image" onclick="openImageModal(this.src)">`;

                // Time
                const formatTime = (t) => { if(!t) return ''; let[h,m]=t.split(':'); return `${h%12||12}:${m} ${h>=12?'PM':'AM'}`; };
                const formatDate = (d) => { let dt=new Date(d); return `${['Min','Sen','Sel','Rab','Kam','Jum','Sab'][dt.getDay()]}, ${dt.getDate()} ${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][dt.getMonth()]}`; };
                
                let displayTime = o.pickupTime ? formatTime(o.pickupTime) : (o.timestamp ? formatTime(`${new Date(o.timestamp).getHours().toString().padStart(2,'0')}:${new Date(o.timestamp).getMinutes().toString().padStart(2,'0')}`) : '');
                let displayDate = o.tanggalJemput ? formatDate(o.tanggalJemput) : (o.timestamp ? formatDate(o.timestamp) : '');

                const namaCustomer = o.nama || o.customerName || o.name || 'Pelanggan';
                const teleponCustomer = o.telepon || o.phone || o.noHp || '-';
                
                const keterangan = o.keterangan || o.notes || o.catatan || '';
                const keteranganHtml = keterangan ? `<div class="ket-box keterangan-box"><div class="ket-label keterangan-label"><i class="fas fa-sticky-note"></i> Keterangan</div><div class="ket-text">${keterangan}</div></div>` : '';
                const deskripsi = o.deskripsi || o.description || '';
                const deskripsiHtml = deskripsi ? `<div class="ket-box deskripsi-box"><div class="ket-label deskripsi-label"><i class="fas fa-comment-dots"></i> Deskripsi</div><div class="ket-text">${deskripsi}</div></div>` : '';
                const koper = o.koper || o.luggage || '';
                const koperHtml = koper && koper !== '-' ? `<div class="ket-box koper-box"><div class="ket-label koper-label"><i class="fas fa-suitcase-rolling"></i> Koper</div><div class="ket-text">${koper}</div></div>` : '';

                // Driver Data
                const dName = o.driverName || '-';
                const dPhone = o.driverPhone || '-';
                const dPlate = o.driverPlate || '-';

                const disabledClass = isDisabled ? 'disabled' : '';
                
                // Render Info Section
                let infoSectionHtml = '';
                
                if (showDriver) {
                    const custPhoneHtml = isDisabled 
                        ? `<span class="info-val">${teleponCustomer}</span>`
                        : `<a href="tel:${teleponCustomer}" class="info-val link">${teleponCustomer}</a>`;

                    const drvPhoneHtml = isDisabled 
                        ? `<span class="info-val">${dPhone}</span>`
                        : `<a href="tel:${dPhone}" class="info-val link">${dPhone}</a>`;
                    
                    infoSectionHtml = `
                        <div class="split-info">
                            <div class="info-box customer">
                                <div class="info-title"><i class="fas fa-user-tag"></i> Pelanggan</div>
                                <div class="info-row"><i class="fas fa-user"></i> <span class="info-val">${namaCustomer}</span></div>
                                <div class="info-row"><i class="fas fa-phone"></i> ${custPhoneHtml}</div>
                            </div>
                            <div class="info-box driver">
                                <div class="info-title"><i class="fas fa-id-card"></i> Driver</div>
                                <div class="info-row"><i class="fas fa-user"></i> <span class="info-val">${dName}</span></div>
                                <div class="info-row"><i class="fas fa-phone"></i> ${drvPhoneHtml}</div>
                                <div class="info-row"><i class="fas fa-car"></i> <span class="plate-tag">${dPlate}</span></div>
                            </div>
                        </div>
                        ${deskripsiHtml}
                        ${koperHtml}
                        ${keteranganHtml}
                    `;
                } else {
                    const phoneHtml = isDisabled 
                        ? `<span class="info-val">${teleponCustomer}</span>`
                        : `<a href="tel:${teleponCustomer}" class="info-val link">${teleponCustomer}</a>`;
                    
                    infoSectionHtml = `
                        <div class="customer-info-single">
                            <div class="customer-header"><i class="fas fa-user-tag"></i> Pelanggan</div>
                            <div class="customer-rows">
                                <div class="info-row"><i class="fas fa-user"></i> <span class="info-val">${namaCustomer}</span></div>
                                <div class="info-row"><i class="fas fa-phone"></i> ${phoneHtml}</div>
                            </div>
                            ${deskripsiHtml}
                            ${koperHtml}
                            ${keteranganHtml}
                        </div>
                    `;
                }

                const routeClickAttr = !isDisabled ? `onclick="openNavigation('${encodeURIComponent(o.pickup)}')"` : '';
                const dropoffClickAttr = !isDisabled ? `onclick="openNavigation('${encodeURIComponent(o.dropoff)}')"` : '';

                return `
                <div class="order-card">
                    <div class="order-content">
                        <div class="order-header">
                            <span class="order-id">#${o.id}</span>
                            <span class="order-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        ${imgHtml}
                        ${infoSectionHtml}
                        <div class="route-wrapper">
                            <div class="route-line"></div>
                            <div class="route-dot start"></div>
                            <div class="route-dot end"></div>
                            <div class="route-point">
                                <div class="route-label">Jemput</div>
                                <div class="route-address ${disabledClass}" ${routeClickAttr}><i class="fas fa-location-arrow"></i><span>${o.pickup}</span></div>
                            </div>
                            <div class="route-point">
                                <div class="route-label">Tujuan</div>
                                <div class="route-address ${disabledClass}" ${dropoffClickAttr}><i class="fas fa-flag-checkered"></i><span>${o.dropoff}</span></div>
                            </div>
                        </div>
                        <div class="order-info">
                            <div class="order-price">${o.price}</div>
                            <div class="order-distance"><i class="fas fa-road"></i> ${o.distance || '-'}</div>
                        </div>
                        <div class="order-footer">
                            <div class="order-datetime">
                                <span class="datetime-date"><i class="fas fa-calendar"></i> ${displayDate}</span>
                                <span class="datetime-time"><i class="fas fa-clock"></i> ${displayTime}</span>
                            </div>
                            ${btnHtml}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        let previousOrderCount = 0, hasInitializedNotif = false;
        db.ref('orders').on('value', (snapshot) => {
            const data = snapshot.val();
            orderData = [];
            let newCount = 0;
            if (data) {
                Object.keys(data).forEach(key => {
                    const item = data[key];
                    if (!item || key === 'undefined') return;
                    if (!item.id) item.id = key;
                    orderData.push(item);
                    if (item.status === 'order') newCount++;
                });
                orderData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            }
            const badge = document.getElementById('orderTabBadge');
            if (newCount > 0) { badge.textContent = newCount; badge.classList.remove('hidden'); } else badge.classList.add('hidden');
            if (hasInitializedNotif && newCount > previousOrderCount) speakNewJob();
            previousOrderCount = newCount; hasInitializedNotif = true;
            renderOrders();
        });

        // ==========================================
        // FUNGSI TAKE ORDER - PENYESUAIAN FIELD PROFIL
        // ==========================================
        async function takeOrder(e, id) {
            e.preventDefault();
            const btn = e.target.closest('button');
            btn.disabled = true; 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            if (!currentUserData) {
                alert("Data profil tidak ditemukan. Coba refresh halaman.");
                btn.disabled = false; btn.innerHTML = 'Ambil'; return;
            }

            // SESUAIKAN DENGAN NAMA FIELD DI PROFIL ANDA
            // Nama: 'nama'
            // Telepon: 'telepon'
            // Plat: 'platMobil'
            
            let dName = currentUserData.nama || '';
            let dPhone = currentUserData.telepon || ''; 
            let dPlate = currentUserData.platMobil || '';

            // Jika data profil kosong, minta input
            if (!dName) {
                let input = prompt("Nama tidak ditemukan di profil.\nMasukkan Nama Anda:");
                if (!input) { btn.disabled = false; btn.innerHTML = 'Ambil'; return; }
                dName = input;
            }

            if (!dPhone) {
                let input = prompt("No. Telepon tidak ditemukan di profil.\nMasukkan No HP:", "08xxxxxxxxxx");
                if (input) dPhone = input; else dPhone = "-";
            }

            if (!dPlate) {
                let input = prompt("Plat Nomor tidak ditemukan di profil.\nMasukkan Plat Nomor:", "DK xxxx XX");
                if (input) dPlate = input.toUpperCase(); else dPlate = "-";
            }

            try {
                await db.ref('orders/' + id).update({
                    status: 'berjalan', 
                    driverId: currentUserId || 'unknown', 
                    driverName: dName, 
                    driverPhone: dPhone, 
                    driverPlate: dPlate, 
                    takenAt: firebase.database.ServerValue.TIMESTAMP
                });
                alert('Order berhasil diambil oleh ' + dName);
            } catch (err) { 
                alert("Gagal mengambil order: " + err.message); 
                btn.disabled = false; 
                btn.innerHTML = '<i class="fas fa-hand-holding-heart"></i> Ambil'; 
            }
        }

        async function cancelOrder(e, id) {
            e.preventDefault();
            if (!confirm("Yakin membatalkan? Order kembali tersedia.")) return;
            const btn = e.target.closest('button'); btn.disabled = true;
            try { await db.ref('orders/' + id).update({ status: 'order', driverId: null, driverName: null, driverPhone: null, driverPlate: null, takenAt: null }); }
            catch (err) { alert(err.message); btn.disabled = false; }
        }

        async function openCameraForFinish(e, id) {
            e.preventDefault(); currentFinishingOrderId = id;
            const modal = document.getElementById('cameraModal'), video = document.getElementById('cameraVideo');
            document.getElementById('cameraPreviewImg').style.display = 'none';
            video.style.display = 'block';
            document.getElementById('captureBtn').style.display = 'flex';
            document.getElementById('confirmBtn').style.display = 'none';
            capturedPhotoBlob = null; modal.classList.add('active');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert('Kamera tidak didukung'); closeCamera(); return; }
            try {
                let stream = null;
                try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }); }
                catch { try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); } catch { stream = await navigator.mediaDevices.getUserMedia({ video: true }); } }
                if (stream) { cameraStream = stream; video.srcObject = stream; await video.play(); }
            } catch (err) { alert('Gagal akses kamera: ' + err.message); closeCamera(); }
        }

        function capturePhoto() {
            const video = document.getElementById('cameraVideo'), canvas = document.getElementById('cameraCanvas'), preview = document.getElementById('cameraPreviewImg');
            if (video.videoWidth === 0) { alert('Kamera belum siap'); return; }
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1); ctx.drawImage(video, 0, 0);
            canvas.toBlob(blob => {
                if (!blob) return;
                capturedPhotoBlob = blob;
                preview.src = URL.createObjectURL(blob); preview.style.display = 'block'; video.style.display = 'none';
                document.getElementById('captureBtn').style.display = 'none'; document.getElementById('confirmBtn').style.display = 'flex';
            }, 'image/jpeg', 0.8);
        }

        async function confirmPhoto() {
            if (!capturedPhotoBlob || !currentFinishingOrderId) return;
            const btn = event.target.closest('button'); btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            try {
                const img = new Image();
                img.src = URL.createObjectURL(capturedPhotoBlob);
                await new Promise(res => img.onload = res);
                const cvs = document.createElement('canvas'), ctx = cvs.getContext('2d');
                let w = img.width, h = img.height;
                if (w > 800 || h > 600) { const r = Math.min(800/w, 600/h); w *= r; h *= r; }
                cvs.width = w; cvs.height = h; ctx.drawImage(img, 0, 0, w, h);
                const b64 = cvs.toDataURL('image/jpeg', 0.7);
                await db.ref('orders/' + currentFinishingOrderId).update({ status: 'selesai', finishPhoto: b64, finishedAt: firebase.database.ServerValue.TIMESTAMP });
                alert('Selesai!'); closeCamera();
            } catch (e) { alert('Error: ' + e.message); btn.innerHTML = '<i class="fas fa-check"></i>'; btn.disabled = false; }
        }

        function closeCamera() {
            if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
            document.getElementById('cameraVideo').srcObject = null;
            document.getElementById('cameraModal').classList.remove('active');
            currentFinishingOrderId = null;
        }

        function openNavigation(addr) { if(!addr) return; window.open(`https://www.google.com/maps/dir/?api=1&destination=${decodeURIComponent(addr)}`, '_blank'); }
    </script>
</body>
