<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orderan Masuk - BGT-PRO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb; --primary-light: #3b82f6; --accent: #0ea5e9;
            --success: #10b981; --danger: #ef4444; --bg-main: #f0f9ff;
            --bg-card: #ffffff; --text-dark: #0f172a; --text-gray: #64748b;
            --border-light: #e2e8f0; --gradient-primary: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            --shadow-soft: 0 4px 20px rgba(37, 99, 235, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow-x: hidden; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-main); color: var(--text-dark); min-height: 100dvh; }

        .app-container { width: 100%; min-height: 100dvh; padding-bottom: 20px; }

        /* Header */
        .header { 
            position: sticky; top: 0; z-index: 100; 
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); 
            padding: 12px 16px; border-bottom: 1px solid var(--border-light); 
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .back-btn { 
            width: 38px; height: 38px; background: var(--bg-main); 
            border: none; border-radius: 10px; color: var(--primary); font-size: 1rem; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
        }
        .back-btn:active { background: #e0f2fe; transform: scale(0.95); }

        /* Filter Tabs */
        .filter-tabs { display: flex; gap: 8px; padding: 8px 16px 12px; overflow-x: auto; margin-top: 4px; }
        .filter-tab { 
            padding: 8px 16px; background: var(--bg-card); 
            border: 1px solid var(--border-light); border-radius: 9999px; 
            font-size: 0.8rem; font-weight: 500; color: var(--text-gray); 
            cursor: pointer; white-space: nowrap; transition: all 0.3s; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            position: relative;
        }
        .filter-tab.active { 
            background: var(--gradient-primary); border-color: transparent; 
            color: white; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); 
        }
        
        /* Badge counter di tab */
        .tab-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border-radius: 50%;
            font-size: 0.55rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(239, 68, 68, 0.3);
            z-index: 10;
        }
        .tab-badge.hidden { display: none; }

        /* Order List */
        .order-list { padding: 0 16px; }
        .order-card { 
            background: var(--bg-card); border-radius: 12px; 
            margin-bottom: 10px; overflow: hidden; 
            border: 1px solid var(--border-light); 
            box-shadow: var(--shadow-soft);
            transition: transform 0.2s;
        }
        .order-card:active { transform: scale(0.99); }
        .order-card.disabled-card {
            opacity: 0.6;
            pointer-events: none;
        }
        
        .order-content { padding: 12px; }
        
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .order-id { font-size: 0.75rem; color: var(--primary); font-weight: 600; }
        .order-badge { padding: 3px 8px; border-radius: 9999px; font-size: 0.65rem; font-weight: 600; }
        .order-badge.new { background: rgba(245, 158, 11, 0.1); color: #d97706; }
        .order-badge.progress { background: rgba(37, 99, 235, 0.1); color: var(--primary); }
        .order-badge.done { background: rgba(16, 185, 129, 0.1); color: var(--success); }

        /* Customer Info */
        .customer-info {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 1px solid #bae6fd;
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 8px;
        }
        .customer-name {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
        }
        .customer-name i { color: var(--primary); font-size: 0.8rem; }
        .customer-phone {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-left: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .customer-phone a { color: var(--primary); text-decoration: none; }
        
        /* Split Info - Customer & Driver */
        .split-info {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }
        .info-box {
            flex: 1;
            background: rgba(255,255,255,0.8);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 8px 10px;
        }
        .info-box.customer {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-color: #bae6fd;
        }
        .info-box.driver {
            background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
            border-color: #86efac;
        }
        .info-header {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .info-box.customer .info-header { color: var(--primary); }
        .info-box.driver .info-header { color: #15803d; }
        .info-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.65rem;
        }
        .info-box.customer .info-avatar { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        .info-box.driver .info-avatar { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .info-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .info-phone {
            font-size: 0.7rem;
            color: var(--text-gray);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }
        .info-phone a { color: var(--primary); text-decoration: none; }
        
        /* Keterangan Box */
        .keterangan-box {
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 6px;
            padding: 6px 8px;
            margin-top: 6px;
        }
        .keterangan-label {
            font-size: 0.6rem;
            color: #dc2626;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .keterangan-text { font-size: 0.75rem; color: var(--text-dark); line-height: 1.3; }

        /* Deskripsi Customer */
        .deskripsi-box {
            background: rgba(37, 99, 235, 0.05);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 6px;
            padding: 6px 8px;
            margin-top: 6px;
        }
        .deskripsi-label {
            font-size: 0.6rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .deskripsi-text { font-size: 0.75rem; color: var(--text-dark); line-height: 1.3; }

        /* Koper Box */
        .koper-box {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 6px;
            padding: 5px 8px;
            margin-top: 5px;
        }
        .koper-label {
            font-size: 0.6rem;
            color: #d97706;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .koper-text { font-size: 0.75rem; color: var(--text-dark); }

        /* Image */
        .order-image { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; display: block; }
        .photo-preview { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; border: 2px solid var(--success); }

        /* Route Visual */
        .route-wrapper { margin-bottom: 10px; position: relative; padding-left: 18px; }
        .route-line { position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--border-light); border-radius: 2px; }
        .route-dot { position: absolute; left: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg-card); z-index: 1; box-shadow: 0 0 0 1px rgba(0,0,0,0.1); }
        .route-dot.start { top: 0; background: var(--success); }
        .route-dot.end { bottom: 0; background: var(--danger); }
        
        .route-point { margin-bottom: 14px; position: relative; }
        .route-point:last-child { margin-bottom: 0; }
        .route-label { font-size: 0.6rem; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1px; font-weight: 600; }
        .route-address {
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1.3;
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 6px;
            transition: color 0.2s;
        }
        .route-address:hover { color: var(--primary); }
        .route-address i { color: var(--primary); font-size: 0.7rem; margin-top: 2px; flex-shrink: 0; }
        .route-address.disabled { cursor: default; pointer-events: none; }
        .route-address.disabled:hover { color: var(--text-dark); }

        .order-info { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--bg-main); padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; 
        }
        .order-price { font-size: 0.95rem; font-weight: 700; color: var(--primary); }
        .order-distance { font-size: 0.7rem; color: var(--text-gray); display: flex; align-items: center; gap: 3px; }

        .order-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-light); padding-top: 10px; margin-top: 5px; }
        
        /* DateTime Display */
        .order-datetime { display: flex; align-items: center; gap: 10px; }
        .datetime-date { font-size: 0.7rem; font-weight: 500; color: var(--text-dark); display: flex; align-items: center; gap: 4px; }
        .datetime-date i { color: var(--text-gray); font-size: 0.65rem; }
        .datetime-time { font-size: 0.7rem; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 4px; }
        .datetime-time i { color: var(--primary); font-size: 0.65rem; }
        
        .action-btn { 
            padding: 6px 14px; border: none; border-radius: 6px; 
            color: white; font-size: 0.7rem; font-weight: 600; cursor: pointer; 
            transition: transform 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .action-btn:active { transform: scale(0.95); }
        .action-btn.take { background: var(--primary); }
        .action-btn.finish { background: linear-gradient(135deg, #10b981 0%, #34d399 100%); }
        .action-btn.done { background: #cbd5e1; color: #64748b; pointer-events: none; box-shadow: none; }

        /* Empty */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-gray); background: var(--bg-card); border-radius: 16px; margin: 0 16px; border: 1px dashed var(--border-light); }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: #cbd5e1; }

        /* Camera Modal */
        .camera-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .camera-modal.active { display: flex; }
        .camera-container { width: 100%; max-width: 400px; position: relative; }
        .camera-video { width: 100%; border-radius: 12px; transform: scaleX(-1); }
        .camera-canvas { display: none; }
        .camera-controls { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .camera-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: transform 0.2s;
        }
        .camera-btn:active { transform: scale(0.9); }
        .camera-btn.capture { background: white; color: #000; }
        .camera-btn.cancel { background: #ef4444; color: white; }
        .camera-btn.confirm { background: #10b981; color: white; }
        .camera-preview-img { width: 100%; max-width: 400px; border-radius: 12px; display: none; }
        .camera-instruction { color: white; text-align: center; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="app-container" id="mainApp">

        <header class="header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='branda.html'"><i class="fas fa-arrow-left"></i></button>
                <div class="header-title">Orderan Masuk</div>
            </div>
        </header>

        <div class="filter-tabs">
            <div class="filter-tab active" onclick="filterOrders('all')">Semua</div>
            <div class="filter-tab" onclick="filterOrders('order')">Order <span class="tab-badge hidden" id="orderTabBadge">0</span></div>
            <div class="filter-tab" onclick="filterOrders('berjalan')">Berjalan</div>
            <div class="filter-tab" onclick="filterOrders('selesai')">Selesai</div>
        </div>

        <div class="order-list" id="orderList">
            <div class="empty-state"><i class="fas fa-box-open"></i><p>Tidak ada orderan</p></div>
        </div>

    </div>

    <!-- Camera Modal -->
    <div class="camera-modal" id="cameraModal">
        <div class="camera-instruction">
            <i class="fas fa-camera"></i> Foto Selfie dengan Tamu
        </div>
        <div class="camera-container">
            <video class="camera-video" id="cameraVideo" autoplay playsinline></video>
            <canvas class="camera-canvas" id="cameraCanvas"></canvas>
            <img class="camera-preview-img" id="cameraPreviewImg">
        </div>
        <div class="camera-controls">
            <button class="camera-btn cancel" id="cancelCameraBtn" onclick="closeCamera()">
                <i class="fas fa-times"></i>
            </button>
            <button class="camera-btn capture" id="captureBtn" onclick="capturePhoto()">
                <i class="fas fa-camera"></i>
            </button>
            <button class="camera-btn confirm" id="confirmBtn" onclick="confirmPhoto()" style="display:none;">
                <i class="fas fa-check"></i>
            </button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCahZIFKFXMCokFNxCpFokNSVtKzN4llus",
            authDomain: "cedar-setup-425414-d7.firebaseapp.com",
            databaseURL: "https://cedar-setup-425414-d7-default-rtdb.firebaseio.com",
            projectId: "cedar-setup-425414-d7",
            storageBucket: "cedar-setup-425414-d7.firebasestorage.app",
            messagingSenderId: "723545991983",
            appId: "1:723545991983:web:379548d2b425a502a60fda"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const firestore = firebase.firestore();
        const storage = firebase.storage();
        
        let currentUserId = null;
        let currentUserData = null;
        let orderData = [];
        let currentFilter = 'all';
        
        // Camera variables
        let cameraStream = null;
        let capturedPhotoBlob = null;
        let currentFinishingOrderId = null;

        // ============================================
        // NOTIFIKASI SUARA
        // ============================================
        function playNotificationSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') audioContext.resume();
                
                // Ding-ding sound
                [880, 1100].forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = freq;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.5, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                        osc.start(audioContext.currentTime);
                        osc.stop(audioContext.currentTime + 0.15);
                    }, i * 200);
                });
            } catch (e) { console.log('Audio error:', e); }
        }

        function speakNewJob() {
            playNotificationSound();
            if ('speechSynthesis' in window) {
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance('Ada job baru');
                    utterance.lang = 'id-ID';
                    utterance.rate = 1;
                    window.speechSynthesis.speak(utterance);
                }, 500);
            }
        }

        // Aktifkan audio saat user interaksi
        document.addEventListener('click', function initAudio() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') ctx.resume();
            document.removeEventListener('click', initAudio);
        }, { once: true });

        // Auth state listener
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUserId = user.uid;
                console.log('User logged in:', currentUserId);
                
                try {
                    const userDoc = await firestore.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        currentUserData = userDoc.data();
                        console.log('User data:', currentUserData);
                    }
                } catch (err) {
                    console.error('Error getting user data:', err);
                }
            } else {
                const localUserData = localStorage.getItem('userData');
                if (localUserData) {
                    try {
                        currentUserData = JSON.parse(localUserData);
                        currentUserId = currentUserData.uid || currentUserData.id || 'local-user';
                    } catch(e) {}
                }
            }
        });

        function filterOrders(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderOrders();
        }

        // Cek apakah order milik driver ini
        function isMyOrder(order) {
            return (order.driverId && order.driverId === currentUserId) || 
                   (currentUserData && order.driverName && order.driverName === currentUserData.nama);
        }

        function renderOrders() {
            const list = document.getElementById('orderList');
            
            let filtered = orderData;
            
            // Filter Logic berdasarkan tab
            if (currentFilter === 'all') {
                // SEMUA: Tampilkan semua order
                filtered = orderData;
            } else if (currentFilter === 'order') {
                // ORDER: HANYA tampilkan order yang TERSEDIA (status: order)
                filtered = orderData.filter(o => o.status === 'order');
            } else if (currentFilter === 'berjalan') {
                // BERJALAN: HANYA tampilkan order yang diambil driver ini
                filtered = orderData.filter(o => {
                    return o.status === 'berjalan' && isMyOrder(o);
                });
            } else if (currentFilter === 'selesai') {
                // SELESAI: Tampilkan order selesai oleh driver ini
                filtered = orderData.filter(o => {
                    return o.status === 'selesai' && isMyOrder(o);
                });
            }

            if (filtered.length === 0) {
                let emptyMsg = 'Tidak ada orderan';
                if (currentFilter === 'berjalan') emptyMsg = 'Tidak ada order yang sedang berjalan';
                else if (currentFilter === 'selesai') emptyMsg = 'Belum ada order yang selesai';
                else if (currentFilter === 'order') emptyMsg = 'Tidak ada order baru';
                list.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>${emptyMsg}</p></div>`;
                return;
            }

            list.innerHTML = filtered.map(o => {
                let badgeClass = 'new';
                let badgeText = 'ORDER BARU';
                let btnHtml = '';
                let isDisabled = false;
                let isMyOrderFlag = isMyOrder(o);
                
                // Logic untuk SEMUA (hanya lihat)
                if (currentFilter === 'all') {
                    if (o.status === 'order') {
                        badgeClass = 'new'; badgeText = 'ORDER BARU';
                    } else if (o.status === 'berjalan') {
                        badgeClass = 'progress'; badgeText = 'SEDANG BERJALAN';
                    } else if (o.status === 'selesai') {
                        badgeClass = 'done'; badgeText = 'SELESAI';
                    }
                    btnHtml = '';
                    isDisabled = true;
                }
                // Logic untuk ORDER tab
                else if (currentFilter === 'order') {
                    badgeClass = 'new'; badgeText = 'TERSEDIA';
                    btnHtml = `<button class="action-btn take" onclick="takeOrder(event, '${o.id}')"><i class="fas fa-hand-holding-heart"></i> Ambil Order</button>`;
                }
                // Logic untuk BERJALAN tab - HANYA order milik driver ini
                else if (currentFilter === 'berjalan') {
                    badgeClass = 'progress'; badgeText = 'SEDANG BERJALAN';
                    // Tombol Selesai - buka kamera
                    btnHtml = `<button class="action-btn finish" onclick="openCameraForFinish(event, '${o.id}')"><i class="fas fa-camera"></i> Selesai</button>`;
                }
                // Logic untuk SELESAI tab
                else if (currentFilter === 'selesai') {
                    badgeClass = 'done'; badgeText = 'SELESAI';
                    btnHtml = '';
                }

                // Image Logic
                let imgHtml = '';
                if (o.finishPhoto) {
                    imgHtml = `<img src="${o.finishPhoto}" class="photo-preview" alt="Foto Selesai">`;
                } else if (o.imageUrl) {
                    imgHtml = `<img src="${o.imageUrl}" class="order-image" alt="Gambar Order">`;
                }

                // Format waktu
                function formatTime12Hour(timeStr) {
                    if (!timeStr) return '';
                    const [hours, minutes] = timeStr.split(':');
                    const hour = parseInt(hours);
                    const ampm = hour >= 12 ? 'PM' : 'AM';
                    const hour12 = hour % 12 || 12;
                    return `${hour12}:${minutes} ${ampm}`;
                }

                function formatDateCustom(dateInput) {
                    let dateObj;
                    if (typeof dateInput === 'string' && dateInput.includes('-')) {
                        dateObj = new Date(dateInput);
                    } else {
                        dateObj = new Date(dateInput);
                    }
                    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    return `${days[dateObj.getDay()]}, ${dateObj.getDate()} ${months[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
                }

                let displayTime = '';
                if (o.pickupTime) {
                    displayTime = formatTime12Hour(o.pickupTime);
                } else if (o.timestamp) {
                    const dateObj = new Date(o.timestamp);
                    displayTime = formatTime12Hour(`${dateObj.getHours().toString().padStart(2, '0')}:${dateObj.getMinutes().toString().padStart(2, '0')}`);
                }
                
                let displayDate = '';
                if (o.tanggalJemput) {
                    displayDate = formatDateCustom(o.tanggalJemput);
                } else if (o.timestamp) {
                    displayDate = formatDateCustom(o.timestamp);
                }

                const namaCustomer = o.nama || o.customerName || o.name || 'Pelanggan';
                const teleponCustomer = o.telepon || o.phone || o.noHp || '';
                
                const keterangan = o.keterangan || o.notes || o.catatan || o.note || '';
                const keteranganHtml = keterangan ? `
                    <div class="keterangan-box">
                        <div class="keterangan-label"><i class="fas fa-sticky-note"></i> Keterangan</div>
                        <div class="keterangan-text">${keterangan}</div>
                    </div>
                ` : '';

                const deskripsi = o.deskripsi || o.description || o.desk || o.pesanCustomer || '';
                const deskripsiHtml = deskripsi ? `
                    <div class="deskripsi-box">
                        <div class="deskripsi-label"><i class="fas fa-comment-dots"></i> Deskripsi Customer</div>
                        <div class="deskripsi-text">${deskripsi}</div>
                    </div>
                ` : '';

                const koper = o.koper || o.luggage || '';
                const koperHtml = koper && koper !== '-' ? `
                    <div class="koper-box">
                        <div class="koper-label"><i class="fas fa-suitcase-rolling"></i> Koper</div>
                        <div class="koper-text">${koper}</div>
                    </div>
                ` : '';

                // Driver info
                const driverName = o.driverName || o.driver || '';
                const driverPlate = o.driverPlate || o.nopol || o.plat || '';
                const driverPhone = o.driverPhone || '';
                const hasDriverInfo = (driverName || driverPlate);
                
                const disabledClass = isDisabled ? 'disabled' : '';
                
                // Phone HTML
                let phoneHtml = '';
                if (isDisabled) {
                    phoneHtml = teleponCustomer ? `<div class="customer-phone"><i class="fas fa-phone"></i> ${teleponCustomer}</div>` : '';
                } else {
                    phoneHtml = teleponCustomer ? `<div class="customer-phone"><a href="tel:${teleponCustomer}"><i class="fas fa-phone"></i> ${teleponCustomer}</a></div>` : '';
                }
                
                // Info Section
                let infoSectionHtml = '';
                if (currentFilter === 'all' && hasDriverInfo) {
                    let driverPhoneHtml = isDisabled 
                        ? (driverPhone ? `<div class="info-phone"><i class="fas fa-phone"></i> ${driverPhone}</div>` : '')
                        : (driverPhone ? `<div class="info-phone"><a href="tel:${driverPhone}"><i class="fas fa-phone"></i> ${driverPhone}</a></div>` : '');
                    
                    infoSectionHtml = `
                        <div class="split-info">
                            <div class="info-box customer">
                                <div class="info-header"><div class="info-avatar"><i class="fas fa-user"></i></div> Customer</div>
                                <div class="info-name">${namaCustomer}</div>
                                ${phoneHtml}
                            </div>
                            <div class="info-box driver">
                                <div class="info-header"><div class="info-avatar"><i class="fas fa-user-tie"></i></div> Driver</div>
                                <div class="info-name">${driverName || 'Driver'}</div>
                                ${driverPhoneHtml}
                                ${driverPlate ? `<div class="info-phone"><i class="fas fa-car"></i> ${driverPlate}</div>` : ''}
                            </div>
                        </div>
                        ${deskripsiHtml}
                        ${koperHtml}
                        ${keteranganHtml}
                    `;
                } else {
                    infoSectionHtml = `
                        <div class="customer-info">
                            <div class="customer-name">
                                <i class="fas fa-user-circle"></i>
                                ${namaCustomer}
                            </div>
                            ${phoneHtml}
                            ${deskripsiHtml}
                            ${koperHtml}
                            ${keteranganHtml}
                        </div>
                    `;
                }

                // Route click
                let routeClickAttr = !isDisabled ? `onclick="openNavigation('${encodeURIComponent(o.pickup)}')"` : '';
                let dropoffClickAttr = !isDisabled ? `onclick="openNavigation('${encodeURIComponent(o.dropoff)}')"` : '';

                return `
                <div class="order-card">
                    <div class="order-content">
                        <div class="order-header">
                            <span class="order-id">#${o.id}</span>
                            <span class="order-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        
                        ${imgHtml}
                        ${infoSectionHtml}

                        <div class="route-wrapper">
                            <div class="route-line"></div>
                            <div class="route-dot start"></div>
                            <div class="route-dot end"></div>
                            
                            <div class="route-point">
                                <div class="route-label">Jemput</div>
                                <div class="route-address ${disabledClass}" ${routeClickAttr}>
                                    <i class="fas fa-location-arrow"></i>
                                    <span>${o.pickup}</span>
                                </div>
                            </div>
                            <div class="route-point">
                                <div class="route-label">Tujuan</div>
                                <div class="route-address ${disabledClass}" ${dropoffClickAttr}>
                                    <i class="fas fa-flag-checkered"></i>
                                    <span>${o.dropoff}</span>
                                </div>
                            </div>
                        </div>

                        <div class="order-info">
                            <div class="order-price">${o.price}</div>
                            <div class="order-distance"><i class="fas fa-road"></i> ${o.distance || '-'}</div>
                        </div>

                        <div class="order-footer">
                            <div class="order-datetime">
                                <span class="datetime-date"><i class="fas fa-calendar"></i> ${displayDate}</span>
                                <span class="datetime-time"><i class="fas fa-clock"></i> ${displayTime}</span>
                            </div>
                            ${btnHtml}
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        // --- DATABASE REALTIME ---
        let previousOrderCount = 0;
        let hasInitializedNotif = false;

        const ordersRef = db.ref('orders');
        ordersRef.on('value', (snapshot) => {
            const data = snapshot.val();
            orderData = [];
            let newOrderCount = 0;
            
            if (data) {
                Object.keys(data).forEach(key => {
                    const item = data[key];
                    if (!item || key === 'undefined') return;
                    if (!item.id) item.id = key;
                    orderData.push(item);
                    if (item.status === 'order') newOrderCount++;
                });
                orderData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            }
            
            // Update badge
            const orderTabBadge = document.getElementById('orderTabBadge');
            if (orderTabBadge) {
                if (newOrderCount > 0) {
                    orderTabBadge.textContent = newOrderCount;
                    orderTabBadge.classList.remove('hidden');
                } else {
                    orderTabBadge.classList.add('hidden');
                }
            }
            
            // Notifikasi suara
            if (hasInitializedNotif && newOrderCount > previousOrderCount) {
                speakNewJob();
            }
            
            previousOrderCount = newOrderCount;
            hasInitializedNotif = true;
            
            renderOrders();
        });

        // Ambil Order
        async function takeOrder(e, id) {
            e.preventDefault();
            const btn = e.target.closest('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengambil...';
            
            let driverName = 'Driver';
            let driverPhone = '-';
            let driverPlate = '-';
            
            try {
                if (currentUserData) {
                    driverName = currentUserData.nama || currentUserData.name || 'Driver';
                    driverPhone = currentUserData.nohp || currentUserData.phone || '-';
                    driverPlate = currentUserData.nopol || currentUserData.plat || '-';
                }
                
                const localUserData = localStorage.getItem('userData');
                if (localUserData) {
                    try {
                        const parsed = JSON.parse(localUserData);
                        if (driverName === 'Driver') driverName = parsed.nama || 'Driver';
                        if (driverPhone === '-') driverPhone = parsed.nohp || '-';
                        if (driverPlate === '-') driverPlate = parsed.nopol || '-';
                    } catch(e) {}
                }
                
                if (driverName === 'Driver') {
                    const inputName = prompt('Masukkan nama Anda:', '');
                    if (inputName) driverName = inputName;
                }
                
                await db.ref('orders/' + id).update({
                    status: 'berjalan',
                    driverId: currentUserId || 'unknown',
                    driverName: driverName,
                    driverPhone: driverPhone,
                    driverPlate: driverPlate,
                    takenAt: firebase.database.ServerValue.TIMESTAMP
                });
                
                alert('Order berhasil diambil oleh ' + driverName + '!');
                
            } catch (err) {
                console.error("Gagal mengambil order:", err);
                alert("Gagal mengambil order: " + err.message);
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // ============================================
        // KAMERA UNTUK SELESAI ORDER
        // ============================================
        function openCameraForFinish(e, id) {
            e.preventDefault();
            currentFinishingOrderId = id;
            
            const modal = document.getElementById('cameraModal');
            const video = document.getElementById('cameraVideo');
            const previewImg = document.getElementById('cameraPreviewImg');
            const captureBtn = document.getElementById('captureBtn');
            const confirmBtn = document.getElementById('confirmBtn');
            
            // Reset state
            previewImg.style.display = 'none';
            video.style.display = 'block';
            captureBtn.style.display = 'flex';
            confirmBtn.style.display = 'none';
            capturedPhotoBlob = null;
            
            modal.classList.add('active');
            
            // Buka kamera depan (selfie)
            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: 'user',
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                } 
            })
            .then(stream => {
                cameraStream = stream;
                video.srcObject = stream;
            })
            .catch(err => {
                console.error('Error accessing camera:', err);
                alert('Tidak dapat mengakses kamera. Pastikan izin kamera sudah diberikan.');
                closeCamera();
            });
        }

        function capturePhoto() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('cameraCanvas');
            const previewImg = document.getElementById('cameraPreviewImg');
            const captureBtn = document.getElementById('captureBtn');
            const confirmBtn = document.getElementById('confirmBtn');
            
            // Set canvas size sama dengan video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Draw video frame ke canvas (mirror)
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0);
            
            // Convert ke blob
            canvas.toBlob(blob => {
                capturedPhotoBlob = blob;
                
                // Show preview
                const url = URL.createObjectURL(blob);
                previewImg.src = url;
                previewImg.style.display = 'block';
                video.style.display = 'none';
                
                // Show confirm button
                captureBtn.style.display = 'none';
                confirmBtn.style.display = 'flex';
            }, 'image/jpeg', 0.8);
        }

        function confirmPhoto() {
            if (!capturedPhotoBlob || !currentFinishingOrderId) return;
            
            const btn = event.target.closest('button');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;
            
            // Upload foto ke Firebase Storage
            const fileName = `finish_photos/${currentFinishingOrderId}_${Date.now()}.jpg`;
            const storageRef = storage.ref(fileName);
            
            storageRef.put(capturedPhotoBlob)
                .then(snapshot => snapshot.ref.getDownloadURL())
                .then(downloadURL => {
                    console.log('Photo uploaded:', downloadURL);
                    
                    // Update order status
                    return db.ref('orders/' + currentFinishingOrderId).update({
                        status: 'selesai',
                        finishPhoto: downloadURL,
                        finishedAt: firebase.database.ServerValue.TIMESTAMP
                    });
                })
                .then(() => {
                    alert('Order selesai!');
                    closeCamera();
                })
                .catch(err => {
                    console.error('Error:', err);
                    alert('Gagal menyimpan: ' + err.message);
                    btn.innerHTML = '<i class="fas fa-check"></i>';
                    btn.disabled = false;
                });
        }

        function closeCamera() {
            const modal = document.getElementById('cameraModal');
            const video = document.getElementById('cameraVideo');
            
            // Stop camera stream
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            
            video.srcObject = null;
            modal.classList.remove('active');
            currentFinishingOrderId = null;
            capturedPhotoBlob = null;
        }

        // Buka Navigasi Google Maps
        function openNavigation(address) {
            if (!address) return;
            const decodedAddress = decodeURIComponent(address);
            const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(decodedAddress)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
