<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peta Anggota - BGT-PRO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --secondary: #8b5cf6;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #06b6d4;
            --sky-light: #f0f9ff;
            --sky-medium: #e0f2fe;
            --sky-soft: #bae6fd;
            --dark: #1e293b;
            --dark-light: #334155;
            --gray: #64748b;
            --gray-light: #94a3b8;
            --white: #ffffff;
            --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #a855f7 100%);
            --gradient-sky: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 30%, #f0f9ff 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--gradient-sky);
            color: var(--dark);
            position: relative;
        }

        /* Subtle animated clouds background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(186, 230, 253, 0.6) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 20%, rgba(224, 242, 254, 0.8) 0%, transparent 50%),
                radial-gradient(ellipse 50% 30% at 60% 70%, rgba(186, 230, 253, 0.4) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: cloudFloat 20s ease-in-out infinite;
        }

        @keyframes cloudFloat {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-10px) translateY(-5px); }
        }

        /* Main App */
        .app-container {
            width: 100%;
            height: 100%;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(79, 70, 229, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-title { 
            font-size: 1.15rem; 
            font-weight: 700;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .back-btn {
            width: 42px;
            height: 42px;
            background: rgba(79, 70, 229, 0.08);
            border: none;
            border-radius: 12px;
            color: var(--primary);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .back-btn:active { background: rgba(79, 70, 229, 0.15); transform: scale(0.95); }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .header-btn {
            width: 42px;
            height: 42px;
            background: rgba(79, 70, 229, 0.08);
            border: none;
            border-radius: 12px;
            color: var(--primary);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .header-btn:active { background: rgba(79, 70, 229, 0.15); }

        /* Map */
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Map Panel */
        .map-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0;
            padding: 16px;
            z-index: 1000;
            max-height: 55vh;
            overflow-y: auto;
            transition: transform 0.3s ease;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.08);
        }
        .map-panel.collapsed { transform: translateY(calc(100% - 55px)); }
        .map-panel-handle {
            width: 45px;
            height: 5px;
            background: rgba(79, 70, 229, 0.15);
            border-radius: 3px;
            margin: 0 auto 14px;
            cursor: pointer;
        }
        .map-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .map-panel-title {
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dark);
        }
        .map-panel-title i {
            color: var(--primary);
        }
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 9999px;
            font-weight: 600;
        }
        .live-dot {
            width: 7px;
            height: 7px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        /* Stats */
        .map-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        .map-stat {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(79, 70, 229, 0.08);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }
        .map-stat-value {
            font-size: 1.5rem;
            font-weight: 800;
        }
        .map-stat-label {
            font-size: 0.7rem;
            color: var(--gray);
            margin-top: 3px;
            font-weight: 500;
        }
        .map-stat.online .map-stat-value { color: var(--success); }
        .map-stat.offline .map-stat-value { color: var(--gray); }
        .map-stat.total .map-stat-value {
            background: var(--gradient-primary);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Legend */
        .map-legend {
            display: flex;
            gap: 16px;
            margin-bottom: 14px;
            padding: 12px;
            background: rgba(79, 70, 229, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(79, 70, 229, 0.06);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: var(--dark);
            font-weight: 500;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .legend-dot.online {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }
        .legend-dot.offline {
            background: var(--gray);
            opacity: 0.6;
        }

        /* Member List */
        .member-list-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--gray);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .map-member-list {
            max-height: 200px;
            overflow-y: auto;
        }
        .map-member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--white);
            border: 1px solid rgba(79, 70, 229, 0.06);
            border-radius: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .map-member-item:active { 
            background: rgba(79, 70, 229, 0.05);
            border-color: var(--primary-light);
        }
        .map-member-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(79, 70, 229, 0.1);
        }
        .map-member-info { flex: 1; }
        .map-member-name {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--dark);
        }
        .map-member-status {
            font-size: 0.75rem;
            color: var(--gray);
        }
        .map-member-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        .map-member-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .map-member-dot.offline { background: var(--gray); opacity: 0.5; }

        /* Custom Marker */
        .custom-marker {
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 3px 12px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .custom-marker.online { background: var(--success); }
        .custom-marker.offline { background: var(--gray); opacity: 0.7; }

        /* Leaflet Popup */
        .leaflet-popup-content-wrapper {
            background: var(--white) !important;
            border-radius: 16px !important;
            color: var(--dark) !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12) !important;
            border: 1px solid rgba(79, 70, 229, 0.08) !important;
        }
        .leaflet-popup-tip { background: var(--white) !important; }
        .leaflet-popup-content { margin: 14px 16px !important; }
        .popup-content { min-width: 200px; }
        .popup-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .popup-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(79, 70, 229, 0.15);
        }
        .popup-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
            color: var(--dark);
        }
        .popup-status {
            font-size: 0.72rem;
            padding: 3px 10px;
            border-radius: 9999px;
            font-weight: 600;
            display: inline-block;
        }
        .popup-status.online { background: rgba(16, 185, 129, 0.12); color: var(--success); }
        .popup-status.offline { background: rgba(100, 116, 139, 0.12); color: var(--gray); }
        .popup-info {
            font-size: 0.85rem;
            color: var(--gray);
        }
        .popup-info div {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .popup-info i { width: 16px; color: var(--primary); }

        /* Locate Button */
        .locate-btn {
            position: fixed;
            bottom: 260px;
            right: 16px;
            width: 52px;
            height: 52px;
            background: var(--white);
            border: 1px solid rgba(79, 70, 229, 0.1);
            border-radius: 50%;
            color: var(--primary);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
        }
        .locate-btn:active {
            transform: scale(0.95);
            background: var(--primary);
            color: white;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 75px;
            left: 16px;
            right: 16px;
            background: var(--white);
            border: 1px solid rgba(79, 70, 229, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2000;
            animation: slideDown 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .toast.hidden { display: none; }
        .toast.hiding { animation: slideUp 0.3s ease forwards; }
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideUp {
            to { transform: translateY(-20px); opacity: 0; }
        }
        .toast-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .toast-icon.success { background: rgba(16, 185, 129, 0.12); color: var(--success); }
        .toast-icon.info { background: rgba(79, 70, 229, 0.12); color: var(--primary); }
        .toast-icon.warning { background: rgba(245, 158, 11, 0.12); color: var(--accent); }
        .toast-content { flex: 1; }
        .toast-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 3px; color: var(--dark); }
        .toast-message { font-size: 0.8rem; color: var(--gray); }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--gray);
        }
        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            opacity: 0.4;
            color: var(--primary-light);
        }
        .empty-state p { font-size: 0.9rem; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(79, 70, 229, 0.15); border-radius: 2px; }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- Main App -->
    <div class="app-container" id="appContainer">
        
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="back-btn" onclick="goBack()" aria-label="Kembali"><i class="fas fa-arrow-left"></i></button>
                <div class="header-title">Peta Anggota</div>
            </div>
            <div class="header-right">
                <button class="header-btn" onclick="togglePanel()" id="togglePanelBtn" aria-label="Toggle Panel">
                    <i class="fas fa-list"></i>
                </button>
                <button class="header-btn" onclick="refreshLocation()" aria-label="Refresh">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </header>

        <!-- Map Container -->
        <div id="map"></div>

        <!-- Locate Button -->
        <button class="locate-btn" onclick="locateMe()" id="locateBtn" aria-label="Lokasi Saya">
            <i class="fas fa-crosshairs"></i>
        </button>

        <!-- Map Panel -->
        <div class="map-panel" id="mapPanel">
            <div class="map-panel-handle" onclick="togglePanelCollapse()"></div>
            
            <div class="map-panel-header">
                <div class="map-panel-title">
                    <i class="fas fa-users"></i> Lokasi Anggota
                    <span class="live-indicator">
                        <span class="live-dot"></span> REALTIME
                    </span>
                </div>
            </div>

            <div class="map-stats">
                <div class="map-stat total">
                    <div class="map-stat-value" id="statTotal">0</div>
                    <div class="map-stat-label">Total</div>
                </div>
                <div class="map-stat online">
                    <div class="map-stat-value" id="statOnline">0</div>
                    <div class="map-stat-label">Online</div>
                </div>
                <div class="map-stat offline">
                    <div class="map-stat-value" id="statOffline">0</div>
                    <div class="map-stat-label">Offline</div>
                </div>
            </div>

            <div class="map-legend">
                <div class="legend-item"><div class="legend-dot online"></div> Online</div>
                <div class="legend-item"><div class="legend-dot offline"></div> Offline</div>
            </div>

            <div class="member-list-title">Anggota dengan Lokasi</div>
            <div class="map-member-list" id="memberList">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Memuat data...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast hidden" id="toast">
        <div class="toast-icon info"><i class="fas fa-info-circle"></i></div>
        <div class="toast-content">
            <div class="toast-title" id="toastTitle">Info</div>
            <div class="toast-message" id="toastMessage">Pesan</div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCahZIFKFXMCokFNxCpFokNSVtKzN4llus",
            authDomain: "cedar-setup-425414-d7.firebaseapp.com",
            databaseURL: "https://cedar-setup-425414-d7-default-rtdb.firebaseio.com",
            projectId: "cedar-setup-425414-d7",
            storageBucket: "cedar-setup-425414-d7.firebasestorage.app",
            messagingSenderId: "723545991983",
            appId: "1:723545991983:web:379548d2b425a502a60fda"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // State
        let map = null;
        let markers = {};
        let membersUnsubscribe = null;
        let allMembers = [];

        // Default map center (Indonesia center)
        const DEFAULT_LAT = -2.5489;
        const DEFAULT_LNG = 118.0149;
        const DEFAULT_ZOOM = 5;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            loadMembersRealtime();
        });

        // Go Back
        function goBack() {
            window.location.href = 'branda.html';
        }

        // Initialize Map
        function initMap() {
            if (map) return;
            
            map = L.map('map', {
                center: [DEFAULT_LAT, DEFAULT_LNG],
                zoom: DEFAULT_ZOOM,
                zoomControl: false
            });
            
            // Add zoom control to bottom left
            L.control.zoom({ position: 'bottomleft' }).addTo(map);
            
            // Add tile layer (OpenStreetMap)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);
            
            console.log('Map initialized');
        }

        // Check Online Status
        function checkOnlineStatus(member) {
            if (!member.currentSessionId) return false;
            
            if (member.lastActive) {
                const lastActiveDate = member.lastActive.toDate ? member.lastActive.toDate() : new Date(member.lastActive);
                const now = new Date();
                const diffMinutes = (now - lastActiveDate) / (1000 * 60);
                
                if (diffMinutes > 2) return false;
            }
            
            return true;
        }

        // Create Custom Marker Icon
        function createMarkerIcon(isOnline) {
            const size = 38;
            
            return L.divIcon({
                className: `custom-marker ${isOnline ? 'online' : 'offline'}`,
                html: `
                    <div style="
                        width: ${size}px;
                        height: ${size}px;
                        border-radius: 50%;
                        border: 3px solid white;
                        background: ${isOnline ? '#10b981' : '#94a3b8'};
                        box-shadow: 0 3px 12px rgba(0,0,0,0.2);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">
                        <i class="fas fa-user" style="color: white; font-size: 15px;"></i>
                    </div>
                `,
                iconSize: [size, size],
                iconAnchor: [size/2, size/2],
                popupAnchor: [0, -size/2]
            });
        }

        // Load Members with Realtime Updates
        function loadMembersRealtime() {
            if (membersUnsubscribe) {
                membersUnsubscribe();
            }
            
            membersUnsubscribe = db.collection('users').onSnapshot((snapshot) => {
                allMembers = [];
                
                snapshot.forEach(doc => {
                    allMembers.push({ id: doc.id, ...doc.data() });
                });
                
                console.log('[REALTIME] Members loaded:', allMembers.length);
                
                updateMarkers();
                updateStats();
                updateMemberList();
            }, (error) => {
                console.error('Realtime listener error:', error);
            });
        }

        // Update Markers
        function updateMarkers() {
            // Clear existing markers
            Object.values(markers).forEach(marker => {
                map.removeLayer(marker);
            });
            markers = {};
            
            // Add markers for members with location
            allMembers.forEach(member => {
                if (member.latitude && member.longitude) {
                    const isOnline = checkOnlineStatus(member);
                    
                    const marker = L.marker([member.latitude, member.longitude], {
                        icon: createMarkerIcon(isOnline)
                    });
                    
                    // Create popup content
                    const popupContent = `
                        <div class="popup-content">
                            <div class="popup-header">
                                <img src="${member.profilePicUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(member.nama || 'User')}&background=4f46e5&color=fff`}" 
                                     alt="${member.nama}" class="popup-avatar">
                                <div>
                                    <div class="popup-name">${member.nama || 'Unknown'}</div>
                                    <span class="popup-status ${isOnline ? 'online' : 'offline'}">
                                        ${isOnline ? 'ONLINE' : 'OFFLINE'}
                                    </span>
                                </div>
                            </div>
                            <div class="popup-info">
                                ${member.email ? `<div><i class="fas fa-envelope"></i> ${member.email}</div>` : ''}
                                ${member.telepon ? `<div><i class="fas fa-phone"></i> ${member.telepon}</div>` : ''}
                                ${member.platMobil ? `<div><i class="fas fa-car"></i> ${member.platMobil}</div>` : ''}
                                ${member.titel ? `<div><i class="fas fa-star"></i> ${member.titel}</div>` : ''}
                            </div>
                        </div>
                    `;
                    
                    marker.bindPopup(popupContent);
                    marker.addTo(map);
                    markers[member.id] = marker;
                }
            });
            
            console.log('Markers updated:', Object.keys(markers).length);
        }

        // Update Stats
        function updateStats() {
            const total = allMembers.length;
            const online = allMembers.filter(m => checkOnlineStatus(m)).length;
            const offline = total - online;
            
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statOnline').textContent = online;
            document.getElementById('statOffline').textContent = offline;
        }

        // Update Member List
        function updateMemberList() {
            const list = document.getElementById('memberList');
            const membersWithLocation = allMembers.filter(m => m.latitude && m.longitude);
            
            if (membersWithLocation.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-map-marker-alt"></i>
                        <p>Belum ada anggota dengan lokasi</p>
                    </div>
                `;
                return;
            }
            
            // Sort: online first, then by name
            membersWithLocation.sort((a, b) => {
                const aOnline = checkOnlineStatus(a);
                const bOnline = checkOnlineStatus(b);
                if (aOnline && !bOnline) return -1;
                if (!aOnline && bOnline) return 1;
                return (a.nama || '').localeCompare(b.nama || '');
            });
            
            list.innerHTML = membersWithLocation.map(member => {
                const isOnline = checkOnlineStatus(member);
                return `
                    <div class="map-member-item" onclick="focusMember('${member.id}')">
                        <img src="${member.profilePicUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(member.nama || 'User')}&background=4f46e5&color=fff`}" 
                             alt="${member.nama}" class="map-member-avatar">
                        <div class="map-member-info">
                            <div class="map-member-name">${member.nama || 'Unknown'}</div>
                            <div class="map-member-status">${isOnline ? 'Online' : 'Offline'}</div>
                        </div>
                        <div class="map-member-dot ${isOnline ? 'online' : 'offline'}"></div>
                    </div>
                `;
            }).join('');
        }

        // Focus on Member
        function focusMember(memberId) {
            const marker = markers[memberId];
            if (marker) {
                map.setView(marker.getLatLng(), 15);
                marker.openPopup();
            }
        }

        // Locate Me
        function locateMe() {
            if (!navigator.geolocation) {
                showToast('warning', 'Tidak Didukung', 'Browser tidak mendukung geolokasi');
                return;
            }
            
            showToast('info', 'Mencari Lokasi', 'Mendapatkan posisi Anda...');
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    map.setView([lat, lng], 15);
                    showToast('success', 'Lokasi Ditemukan', 'Posisi Anda telah ditampilkan');
                },
                (error) => {
                    let msg = 'Gagal mendapatkan lokasi';
                    if (error.code === 1) msg = 'Izin lokasi ditolak';
                    if (error.code === 2) msg = 'Lokasi tidak tersedia';
                    if (error.code === 3) msg = 'Timeout';
                    showToast('warning', 'Error', msg);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // Refresh Location
        function refreshLocation() {
            updateMarkers();
            updateStats();
            updateMemberList();
            showToast('info', 'Diperbarui', 'Data lokasi telah diperbarui');
        }

        // Toggle Panel
        function togglePanel() {
            const panel = document.getElementById('mapPanel');
            panel.classList.toggle('collapsed');
        }

        // Toggle Panel Collapse
        function togglePanelCollapse() {
            const panel = document.getElementById('mapPanel');
            panel.classList.toggle('collapsed');
        }

        // Show Toast
        function showToast(type, title, message) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = toast.querySelector('.toast-icon');
            
            toastTitle.textContent = title;
            toastMessage.textContent = message;
            
            toastIcon.className = 'toast-icon ' + type;
            toastIcon.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : (type === 'warning' ? 'exclamation-triangle' : 'info-circle')}"></i>`;
            
            toast.classList.remove('hidden', 'hiding');
            
            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 300);
            }, 3000);
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (membersUnsubscribe) {
                membersUnsubscribe();
            }
        });
    </script>

</body>
</html>
